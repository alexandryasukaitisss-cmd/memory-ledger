name: Tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [24, 26]
        include:
          - os: ubuntu-24.04
            node: 24
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python || '3.14' }}
      - name: Versions and SQLite FTS5
        run: |
          node --version
          python3 -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(content)'); print(sqlite3.sqlite_version)"
      - run: npm test
        if: runner.os != 'Windows'
      - name: Portable core contracts on Windows (Hermes requires POSIX)
        if: runner.os == 'Windows'
        run: node --test tests/fact-lineage.test.mjs tests/memory-contract.test.mjs tests/node-python.test.mjs tests/policy.test.mjs tests/journal-tools.test.mjs
      - run: npm run demo
